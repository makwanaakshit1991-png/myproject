<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - GrabIt</title>
<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=stylesheet" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
 
    <style>
        :root {
            --primary: #2563EB;
            --bg-body: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --radius: 12px;
        }
 
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .hidden { display: none; }
 
        /* Navbar */
        .navbar { background: white; border-bottom: 1px solid var(--border); height: 70px; display: flex; align-items: center; }
        .nav-content { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .nav-brand { font-size: 1.5rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 6px; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-link { font-weight: 500; color: var(--text-muted); text-decoration: none; }
        .nav-link:hover { color: var(--primary); }
 
        /* Hero */
        .hero { padding: 60px 0; text-align: center; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 16px; }
        .hero p { font-size: 1.1rem; color: var(--text-muted); }
 
        /* Grid */
        .grid-layout { display: grid; grid-template-columns: 250px 1fr; gap: 30px; margin-bottom: 60px; }
        .sidebar button {
            display: block; width: 100%; padding: 12px; margin-bottom: 8px;
            text-align: left; border: 1px solid var(--border); background: white;
            border-radius: 8px; cursor: pointer; color: var(--text-muted);
        }
        .sidebar button.active, .sidebar button:hover {
            background: #EFF6FF; color: var(--primary); border-color: var(--primary);
        }
 
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .card { background: white; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .card-img { height: 180px; width: 100%; object-fit: cover; background: #eee; }
        .card-body { padding: 16px; }
        .price { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
        .title { font-weight: 600; margin-bottom: 8px; }
        .meta { font-size: 0.85rem; color: var(--text-muted); }
 
        .btn-logout { background: #FEE2E2; color: #EF4444; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
 
    <!-- Navigation -->
<nav class="navbar">
<div class="container nav-content">
<a href="#" class="nav-brand"><i class="ri-store-2-fill"></i> GrabIt</a>
<div class="nav-links">
<!-- User Info populated via JS -->
<span id="welcomeMsg" style="font-weight: 600; color: var(--text-main);">Loading...</span>
<button class="btn-logout" onclick="logout()">Log Out</button>
</div>
</div>
</nav>
 
    <!-- Content -->
<div class="container">
<div class="hero">
<h1>Find What You Need</h1>
<p>Browse categories or search for specific items.</p>
</div>
 
        <div class="grid-layout">
<!-- Sidebar -->
<aside class="sidebar">
<button class="active" onclick="filter('All', this)">All Items</button>
<button onclick="filter('Vehicles', this)">🚗 Vehicles</button>
<button onclick="filter('Electronics', this)">📱 Electronics</button>
<button onclick="filter('Furniture', this)">🛋️ Furniture</button>
<button onclick="filter('Books', this)">📚 Books</button>
</aside>
 
            <!-- Feed -->
<main>
<div id="productFeed" class="product-grid">
<!-- Products injected via JS -->
</div>
</main>
</div>
</div>
 
    <script>
        // 1. Data (Mock Products)
        const products = [
            { id: 1, title: 'Calculus Textbook', price: 45, category: 'Books', img: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=300&q=80%27' },
            { id: 2, title: 'Mountain Bike', price: 120, category: 'Vehicles', img: 'https://images.unsplash.com/photo-1532298229144-0ec0c57515c7?auto=format&fit=crop&w=300&q=80%27' },
            { id: 3, title: 'Mechanical Keyboard', price: 80, category: 'Electronics', img: 'https://images.unsplash.com/photo-1587829741301-dc798b91add1?auto=format&fit=crop&w=300&q=80%27' },
            { id: 4, title: 'Study Desk', price: 60, category: 'Furniture', img: 'https://images.unsplash.com/photo-1518455027359-f3f8164ba6bd?auto=format&fit=crop&w=300&q=80%27' },
            { id: 5, title: 'Physics Lab Coat', price: 30, category: 'Books', img: 'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=300&q=80%27' },
            { id: 6, title: 'Wireless Mouse', price: 25, category: 'Electronics', img: 'https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?auto=format&fit=crop&w=300&q=80%27' }
        
  
];
 
        // 2. Check Login on Page Load
        document.addEventListener('DOMContentLoaded', function() {
            const userStr = localStorage.getItem('currentUser');
            if (!userStr) {
                // If no user found, send back to login
                window.location.href = 'login.html';
            } else {
                // Parse user object to get Full Name
                const userObj = JSON.parse(userStr);
                // Update UI with Full Name
                document.getElementById('welcomeMsg').textContent = `Hello, ${userObj.name}`;
                renderGrid(products);
            }
        });
 
        // 3. Logout Function
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }
 
        // 4. Render Products
        function renderGrid(items) {
            const grid = document.getElementById('productFeed');
            grid.innerHTML = items.map(item => `
<div class="card">
<img src="${item.img}" class="card-img" alt="${item.title}">
<div class="card-body">
<div class="price">$${item.price}</div>
<div class="title">${item.title}</div>
<div class="meta">${item.category}</div>
</div>
</div>
            `).join('');
        }
 
        // 5. Filter Function
        function filter(cat, btn) {
            document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
 
            if(cat === 'All') {
                renderGrid(products);
            } else {
                const filtered = products.filter(p => p.category === cat);
                renderGrid(filtered);
            }
        }
</script>
</body>
</html>
